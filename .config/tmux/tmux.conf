# ===========================================
# General Configuration
# ===========================================

# Enable mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Auto-renumber windows (closing window re-indexes existing windows to their new numbers)
set -g renumber-windows on

# Enable system clipboard
set -g set-clipboard on

# Large scrollback buffer
set -g history-limit 100000

# 1 second repeat window
set -g repeat-time 1000

# Remove delay in nvim/vim when hitting Esc in editor
set -s escape-time 0

# ===========================================
# Key Bindings
# ===========================================

# Set prefix, r to reload tmux.conf
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display " 󰁯 Config reloaded!"

# Set prefix to ctrl + space (default: ctrl + b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Open new panes in current directory (using - and |)
unbind '"' # default split window vertically
unbind %   # default split window horizontally
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Open new windows in current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes via vim-motion
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with vim-motion
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===========================================
# Plugins
# ===========================================
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"

# [tmux-continuum] automatically resurrect tmux environment after system restart
set -g @continuum-restore "on"
set -g @continuum-save-interval "15" # save every 15 minutes

# [tmux-yank] Set vi-mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ===========================================
# Visual Improvements
# ===========================================

# Set TokyoNight Day when light, otherwise fallback to TokyoNight
set -g @thm_bg "#{?#{==:#{client_theme},light},#e1e2e7,#1a1b26}"
set -g @thm_bg_highlight "#{?#{==:#{client_theme},light},#c4c8da,#24283b}"
set -g @thm_gray "#{?#{==:#{client_theme},light},#a1a6c5,#414868}"
set -g @thm_red "#{?#{==:#{client_theme},light},#f52a65,#f7768e}"
set -g @thm_orange "#{?#{==:#{client_theme},light},#b15c00,#ff9e64}"
set -g @thm_yellow "#{?#{==:#{client_theme},light},#8c6c3e,#e0af68}"
set -g @thm_green "#{?#{==:#{client_theme},light},#587539,#9ece6a}"
set -g @thm_teal "#{?#{==:#{client_theme},light},#118c74,#73daca}"
set -g @thm_blue "#{?#{==:#{client_theme},light},#2e7de9,#7aa2f7}"
set -g @thm_purple "#{?#{==:#{client_theme},light},#9854f1,#bb9af7}"
set -g @thm_white "#{?#{==:#{client_theme},light},#3760bf,#c0caf5}"

# Set true colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc,screen-256color:Tc,xterm-256color:Tc"
set -sa terminal-features ",tmux-256color:RGB,screen-256color:RGB,xterm-256color:RGB"

# check status every x seconds
set -g status-interval 15

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{E:@thm_red},fg=#{E:@thm_bg},bold]  #S },#{?pane_in_mode,#{#[bg=#{E:@thm_yellow},fg=#{E:@thm_bg},bold]  #S },#{#[bg=#{E:@thm_bg},fg=#{E:@thm_teal}]  #S }}}"
set -ga status-left "#[bg=#{E:@thm_bg},fg=#{E:@thm_blue},none]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{E:@thm_bg},fg=#{E:@thm_purple}]  #{pane_current_command} "
set -ga status-left "#[bg=#{E:@thm_bg},fg=#{E:@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=#{E:@thm_bg},fg=#{E:@thm_blue}] 󰭦 %m/%d/%y 󰅐 %H:%M "

# other look and feel
set -g status-position top
set -g status-style "bg=#{E:@thm_bg}"
set -g status-justify "absolute-centre"

# copy selection and message/prompt look and feel
set -g mode-style "bg=blue,fg=black"
set -g message-style "bg=#{E:@thm_bg_highlight},fg=#{E:@thm_white}"
set -g message-command-style "bg=#{E:@thm_bg_highlight},fg=#{E:@thm_white},bold"

# pane border look and feel
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-active-border-style "bg=#{E:@thm_bg},fg=#{E:@thm_gray}"
set -g pane-border-style "bg=#{E:@thm_bg},fg=#{E:@thm_bg_highlight}"
set -g pane-border-lines single

# window look and feel
set -g automatic-rename off

set -g window-status-format " #I#{?#{!=:#{window_name},Window},:#W,} "
set -g window-status-style "bg=#{E:@thm_bg},fg=#{E:@thm_white}"
set -g window-status-last-style "bg=#{E:@thm_bg},fg=#{E:@thm_white}"
set -g window-status-activity-style "bg=#{E:@thm_red},fg=#{E:@thm_bg}"
set -g window-status-bell-style "bg=#{E:@thm_red},fg=#{E:@thm_bg},bold"
set -g window-status-separator "#[bg=#{E:@thm_bg},fg=#{E:@thm_gray}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},:#W,} "
set -g window-status-current-style "bg=#{E:@thm_orange},fg=#{E:@thm_bg},bold"

# Initialize TMUX plugin manager (keep this line at the very bottom of the .tmux.conf)
run "~/.config/tmux/plugins/tpm/tpm"
